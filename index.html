<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giordano</title>
<meta name="description" content="Fotografie di montagna, mare e altrove.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <a class="topbar__name" href="#top">Giordano</a>
  <nav class="topbar__nav" aria-label="Categorie">
    <button class="navlink is-active" data-filter="all">Tutte</button>
    <button class="navlink" data-filter="sky">Sky</button>
    <button class="navlink" data-filter="heart">Heart</button>
    <button class="navlink" data-filter="water">Water</button>
    <a class="navlink" href="#about">About</a>
  </nav>
  <button class="topbar__burger" id="burger" aria-label="Apri il menu" aria-expanded="false">Menu</button>
</div>

<a id="top"></a>

<main class="stream" id="stream"></main>

<section class="about" id="about">
  <div class="about__inner">
    <p class="about__kicker">About</p>
    <h2 class="about__title">Giordano</h2>
    <p class="about__text">Ingegnere aerospaziale, alpinista, sub. Vivo a Torino e passo il tempo libero in quota o sott'acqua, con una fotocamera dietro.</p>
    <a class="about__link" href="https://instagram.com/" target="_blank" rel="noopener">Instagram ↗</a>
  </div>
</section>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="lightbox__close" id="lbClose" aria-label="Chiudi">✕</button>
  <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Foto precedente">‹</button>
  <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Foto successiva">›</button>
  <figure class="lightbox__figure">
    <img id="lbImg" src="" alt="">
    <figcaption id="lbCaption"></figcaption>
  </figure>
</div>

<script src="photos.js"></script>
<script src="script.js"></script>
</body>
</html>
